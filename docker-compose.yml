version: '3.8'

services:
  carecover-copilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carecover_copilot
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME}
    restart: unless-stopped
